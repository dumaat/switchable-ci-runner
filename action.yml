name: switchable-ci-runner route
description: >
  Picks the runner for the next jobs: your machine (self-hosted, with the label)
  if it is online and free, otherwise the GitHub-hosted fallback. While you use
  your machine, the agent asks you; this step waits for that answer before falling back.
inputs:
  token:
    description: A token that can list the repository's self-hosted runners (repo admin; fine-grained "Administration: read").
    required: true
  label:
    description: The label the agent registered the runner with.
    default: switchable
  fallback:
    description: The GitHub-hosted runner, as JSON (a string or a list of labels).
    default: '"windows-latest"'
  wait-seconds:
    description: How long to wait for your machine (the popup lasts 45 s).
    default: "90"
  min-free:
    description: >
      How many free runners your machine must have before jobs go there. With
      parallel jobs, set it to the jobs this run starts at once (a matrix of 4: "4")
      so the run never waits on fewer runners than it needs.
    default: "1"
outputs:
  runner:
    description: JSON for runs-on, e.g. ["self-hosted","switchable"] or "windows-latest".
    value: ${{ steps.route.outputs.runner }}
runs:
  using: composite
  steps:
    - id: route
      shell: bash
      env:
        TOKEN: ${{ inputs.token }}
        LABEL: ${{ inputs.label }}
        FALLBACK: ${{ inputs.fallback }}
        WAIT: ${{ inputs.wait-seconds }}
        MIN_FREE: ${{ inputs.min-free }}
      run: |
        set -euo pipefail
        free() {
          curl -fsS -H "Authorization: Bearer $TOKEN" -H "Accept: application/vnd.github+json" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/runners?per_page=100" |
            jq --arg l "$LABEL" '[.runners[] | select(.status == "online" and (.busy | not) and any(.labels[]; .name == $l))] | length'
        }
        deadline=$(( $(date +%s) + WAIT ))
        while :; do
          n=$(free || echo 0)
          if [ "$n" -ge "$MIN_FREE" ] && [ "$n" -gt 0 ]; then
            echo "runner=$(jq -cn --arg l "$LABEL" '["self-hosted", $l]')" >> "$GITHUB_OUTPUT"
            echo "Your machine has $n free runner(s): jobs run there."
            exit 0
          fi
          [ "$(date +%s)" -ge "$deadline" ] && break
          sleep 5
        done
        echo "runner=$FALLBACK" >> "$GITHUB_OUTPUT"
        echo "Your machine did not have $MIN_FREE free runner(s) in ${WAIT}s: jobs go to GitHub."
