[package]
name = "switchable-ci-runner"
version = "0.1.5"
edition = "2024"
license = "MIT"
description = "Use your own PC as a GitHub Actions self-hosted runner when it suits you, with automatic fallback to GitHub-hosted runners: a tray app that asks before running jobs while you work."
repository = "https://github.com/dumaat/switchable-ci-runner"
readme = "README.md"
keywords = ["github-actions", "self-hosted-runner", "ci", "runner-fallback", "tray"]
categories = ["development-tools", "development-tools::build-utils"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"

[target.'cfg(windows)'.dependencies]
tray-icon = "0.26.1"
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging",
  "Win32_System_SystemInformation",
  "Win32_System_Power",
  "Win32_System_Threading",
  "Win32_System_Console",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_JobObjects",
  "Win32_Security",
] }

[profile.release]
strip = true
